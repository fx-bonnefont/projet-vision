[project]
name = "segdino"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.21",
    "mlflow>=3.9.0",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.8",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
    "transformers>=4.40,<6",
]

[dependency-groups]

jupyter = [
    "jupyter",
    "jupyterlab",
    "jupyterlab-lsp",
    "python-lsp-server",
    "jupyterlab-git",
    "ipywidgets",
    "ipympl",
    "jupytext",
]